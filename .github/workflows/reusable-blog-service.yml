name: Canonical blog service

on:
  workflow_call:
    inputs:
      force:
        description: Run the publishing cycle even when the cadence is not due.
        required: false
        default: false
        type: boolean
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run the site-scoped canonical blog service
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          args=()
          if [[ "${{ inputs.force }}" == "true" ]]; then
            args+=(--force)
          fi
          node .website/agent.mjs run npm run blog:publish -- "${args[@]}"
